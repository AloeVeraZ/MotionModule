[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionmodule"
version = "0.12.1"
description = "Raspberry Pi control runtime for eight brushed motors and PCA9685 servos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "smbus2>=0.5,<1",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
# Only needed to auto-stream a plugged-in USB camera on the Driver Station.
# Without it, the camera tile stays a labelled offline placeholder.
camera = ["opencv-python-headless>=4.8,<5"]

[project.scripts]
motionmodule-python = "motion_module.cli:main"

[tool.setuptools.packages.find]
where = ["core"]
include = ["motion_module*"]

[tool.setuptools.package-data]
motion_module = [
  "shipped_samples.json",
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.svg",
  "static/*.png",
  "static/fonts/*",
]
